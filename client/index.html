<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080b14" />
    <meta name="description" content="Matiur Rahaman — Full-Stack Developer portfolio showcasing enterprise-style web applications and projects." />
    <title>Matiur Rahaman - Full-Stack Developer Portfolio</title>
    <style>
      html,body{margin:0;min-height:100%;background:#080b14;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .boot-screen{min-height:100vh;display:grid;place-content:center;gap:12px;padding:24px;text-align:center}
      .boot-mark{width:42px;height:42px;margin:0 auto;border:3px solid #1f2937;border-top-color:#22c55e;border-radius:50%;animation:spin .8s linear infinite}
      .boot-title{font-size:18px;font-weight:700}.boot-copy{font-size:13px;color:#9ca3af}
      @keyframes spin{to{transform:rotate(360deg)}}
      @media(prefers-reduced-motion:reduce){.boot-mark{animation:none}}
    </style>
  </head>
  <body>
    <div id="root">
      <main class="boot-screen" role="status" aria-live="polite">
        <span class="boot-mark" aria-hidden="true"></span>
        <span class="boot-title">Loading Matiur Rahaman’s portfolio…</span>
        <span class="boot-copy">If this screen remains, reload the page or check your connection.</span>
      </main>
    </div>
    <noscript><p style="padding:24px;text-align:center">JavaScript is required to view this portfolio.</p></noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
